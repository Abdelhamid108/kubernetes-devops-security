apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: devsecops
  name: devsecops

spec:
  replicas: 2

  selector:
    matchLabels:
      app: devsecops

  strategy: {}

  template:
    metadata:
      labels:
        app: devsecops

    spec:
      serviceAccountName: default
      automountServiceAccountToken: false

      hostUsers: false

      securityContext:
        seccompProfile:
          type: RuntimeDefault
        appArmorProfile:
          type: RuntimeDefault  

      containers:
        - name: devsecops-container
          image: replace

          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

            readOnlyRootFilesystem: true

          resources:
            requests:
              cpu: "25m"
              memory: "50Mi"

            limits:
              cpu: "200m"
              memory: "512Mi"

---
apiVersion: v1
kind: Service

metadata:
  labels:
    app: devsecops
  name: devsecops-svc

spec:
  ports:
    - port: 8080
      protocol: TCP
      targetPort: 8080

  selector:
    app: devsecops

  type: NodePort